name: Tests E2E

on: deployment_status

jobs:
  tests:
    name: Tests E2E
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Browsers + system deps preinstalled for the pinned @playwright/test version.
    # (Old Playwright can't `install --with-deps` on newer Ubuntu runners.)
    container:
      image: mcr.microsoft.com/playwright:v1.41.2-jammy
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🎯 Read .nvmrc
        run: echo "##[set-output name=NVMRC;]$(cat .nvmrc)"
        id: nvm

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'

      - name: 📦 Setup pnpm - Install pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: 📦 Setup pnpm -  Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 📦 Setup pnpm - Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🎭 Run Playwright tests
        run: pnpm test:e2e
        env:
          HOME: /root
          BASE_URL: ${{ github.event.deployment_status.target_url }}

      - name: 📊 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
